openapi: 3.1.0
info:
  title: Raphah Lead Engine API
  version: 3.3.4
  description: Permitted-source discovery, collection, structured evidence, scoring, lead, audit, and operational lifecycle API with isolated demo, pilot, and production data modes.
servers:
  - url: https://d-raphah-leads-engine.vercel.app
security:
  - bearerAuth: []
    workspaceId: []
paths:
  /api/health/live:
    get:
      security: []
      summary: Process liveness
      responses: { "200": { description: Process is accepting requests } }
  /api/health/ready:
    get:
      security: []
      summary: Database, worker, and canary readiness
      responses:
        "200": { description: Ready }
        "503": { description: Configuration, database, or worker is not ready }
  /api/v1/bootstrap:
    get:
      summary: Load the authenticated operations workspace
      responses: { "200": { description: Workspace snapshot } }
  /api/v1/sources:
    get:
      summary: List source definitions and active policies
      responses: { "200": { description: Source list } }
    post:
      summary: Create a source with a pending policy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses: { "201": { description: Source and policy created } }
  /api/v1/sources/{sourceId}/approve:
    post:
      summary: Human-approve and activate a source policy
      parameters:
        - {
            name: sourceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 5 } }
      responses: { "200": { description: Source activated } }
  /api/v1/criteria/{campaignId}:
    patch:
      summary: Update scoring criteria and persistent schedule
      parameters:
        - {
            name: campaignId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CriteriaUpdate" }
      responses: { "200": { description: Campaign updated } }
  /api/v1/scrape-jobs:
    get:
      summary: List durable jobs and attempts
      responses: { "200": { description: Job list } }
    post:
      summary: Queue an idempotent manual scrape job
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, targetUrl]
              properties:
                sourceId: { type: string, format: uuid }
                targetUrl: { type: string, format: uri }
                maxAttempts:
                  { type: integer, minimum: 1, maximum: 10, default: 3 }
      responses: { "202": { description: Job queued or idempotently returned } }
  /api/v1/criteria/{campaignId}/suggestion:
    get:
      summary: Suggest bounded thresholds from campaign-specific weekly distinct qualified organizations
      description: Recommendations require human review. Geography and source policy are never loosened automatically.
      parameters:
        - {
            name: campaignId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        { "200": { description: Direction, proposed changes, and rationale } }
  /api/v1/scrape-jobs/{jobId}:
    get:
      summary: Inspect a job, its attempts, evidence, and score
      parameters:
        - {
            name: jobId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "200": { description: Complete job lifecycle } }
  /api/v1/scrape-jobs/{jobId}/events:
    get:
      summary: Read job lifecycle as server-sent events
      parameters:
        - {
            name: jobId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Ordered attempt and audit events
          content: { text/event-stream: { schema: { type: string } } }
  /api/v1/scrape-jobs/{jobId}/retry:
    post:
      summary: Recover a failed/dead-letter job
      parameters:
        - {
            name: jobId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses: { "200": { description: Job requeued } }
  /api/v1/scrape-jobs/{jobId}/cancel:
    post:
      summary: Cancel queued/retrying/leased work
      parameters:
        - {
            name: jobId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody: { $ref: "#/components/requestBodies/Reason" }
      responses: { "200": { description: Job cancelled } }
  /api/v1/terms:
    get:
      summary: List explicitly accepted third-party source terms
      responses: { "200": { description: Workspace terms acceptances } }
  /api/v1/terms/accept:
    post:
      summary: Record a human source-licence acceptance
      description: Owner or administrator action. Acceptance must never be automated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termsId]
              properties:
                termsId:
                  enum:
                    [overpass-osm, toronto-open-data, canada-job-bank-open-data]
                notes: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Acceptance recorded and audited }
        "422": { description: Unknown terms identifier }
  /api/v1/discovery/sources:
    get:
      summary: List configured discovery adapters
      responses: { "200": { description: Discovery source list } }
    post:
      summary: Register a bounded discovery adapter configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoverySourceInput" }
      responses:
        "201": { description: Discovery source registered }
        "409": { description: Collection source data mode does not match }
  /api/v1/discovery/sources/{discoverySourceId}/run:
    post:
      summary: Execute discovery and persist every candidate
      parameters:
        - name: discoverySourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          { description: Discovery completed and eligible scrape jobs queued }
        "409": { description: Required source terms have not been accepted }
  /api/v1/discovery/runs:
    get:
      summary: Inspect discovery run counts and failures
      parameters:
        - name: source_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses: { "200": { description: Discovery run history } }
  /api/v1/discovery/candidates:
    get:
      summary: Inspect persistent candidates, including unresolved records
      parameters:
        - $ref: "#/components/parameters/DataMode"
      responses: { "200": { description: Mode-isolated candidate list } }
  /api/v1/discovery/candidates/{candidateId}/resolve:
    post:
      summary: Human-resolve a candidate website and atomically queue collection
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [website, notes]
              properties:
                website: { type: string, format: uri }
                notes: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "202": { description: Candidate resolved and durable job queued }
        "404": { description: Candidate not found in workspace }
        "409": { description: Candidate/source mode mismatch }
  /api/v1/funnel:
    get:
      summary: Inspect the mode-specific discovery-to-qualified funnel
      parameters:
        - $ref: "#/components/parameters/DataMode"
        - name: windowDays
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses: { "200": { description: Funnel counts } }
  /api/v1/leads:
    get:
      summary: List persistent qualified leads with evidence-backed assessments
      responses: { "200": { description: Qualified lead list } }
  /api/v1/handoffs:
    post:
      summary: Human-approved emission of a signed LeadEngineHandoffPackage into the durable outbox
      responses:
        "201":
          { description: Enqueued handoff with id, manifestChecksum, status }
        "404": { description: Opportunity not found in the caller's workspace }
  /api/v1/audit-events:
    get:
      summary: List workspace audit events
      responses: { "200": { description: Audit event list } }
  /api/v1/operations:
    get:
      summary: Inspect workers, 72-hour completion, and schedule-start p95
      responses: { "200": { description: Operational snapshot } }
  /api/v1/worker/tick:
    post:
      security: [{ qstashSignature: [] }]
      summary: Run one durable worker and operational-alert evaluation tick
      responses:
        "200": { description: Worker tick completed }
        "401": { description: QStash signature or worker credential invalid }
  /api/v1/canary/run:
    post:
      security: [{ qstashSignature: [] }]
      summary: Idempotently enqueue the current hourly canary
      responses:
        "202": { description: Canary accepted }
        "401": { description: QStash signature or worker credential invalid }
  /api/v1/qstash/failure:
    post:
      security: [{ qstashSignature: [] }]
      summary: Receive a signed QStash final-delivery failure callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer }
                retried: { type: integer }
                maxRetries: { type: integer }
                sourceMessageId: { type: string }
                scheduleId: { type: string }
                dlqId: { type: string }
                url: { type: string, format: uri }
                sourceBody:
                  { type: string, description: Base64-encoded original body }
      responses:
        "202": { description: Failure accepted and incident reconciled }
        "401": { description: QStash signature invalid }
  /api/v1/operations/evaluate:
    post:
      security: [{ qstashSignature: [] }]
      summary: Independently evaluate and reconcile operational alert state
      responses:
        "200": { description: Alert evaluation completed }
        "401": { description: QStash signature invalid }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    workspaceId: { type: apiKey, in: header, name: X-Workspace-ID }
    qstashSignature:
      { type: apiKey, in: header, name: Upstash-Signature }
  parameters:
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: false,
        schema: { type: string },
      }
    DataMode:
      name: mode
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DataMode" }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties: { reason: { type: string, minLength: 3 } }
  schemas:
    SourceInput:
      type: object
      required:
        [
          name,
          baseUrl,
          collectionMethod,
          businessPurpose,
          allowedDomains,
          contactEmail,
        ]
      properties:
        name: { type: string }
        baseUrl: { type: string, format: uri }
        collectionMethod: { enum: [api, rss, sitemap, static_html] }
        businessPurpose: { type: string }
        allowedDomains: { type: array, items: { type: string } }
        allowDiscoveredDomains:
          type: boolean
          default: false
          description: Explicitly permits approved discovery adapters to collect candidate public domains; all normal URL, robots, path, rate, and budget safeguards still apply.
        allowlistPaths:
          { type: array, items: { type: string }, default: ["/*"] }
        denylistPaths: { type: array, items: { type: string } }
        dailyBudget: { type: integer, default: 100 }
        monthlyBudget: { type: integer, default: 2000 }
        maxDepth: { type: integer, default: 2 }
        rateLimitRps: { type: number, default: 1 }
        retentionMonths: { type: integer, default: 12 }
        intervalMinutes: { type: integer, default: 1440 }
        userAgent: { type: string }
        contactEmail: { type: string, format: email }
        dataMode: { $ref: "#/components/schemas/DataMode" }
    DataMode:
      type: string
      enum: [demo, pilot, production]
      default: pilot
    DiscoverySourceInput:
      type: object
      required: [name, adapterId, geo, sourceId, dataMode]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        adapterId: { enum: [overpass, toronto_open_data, job_bank] }
        geo:
          type: object
          required: [city]
          properties:
            city: { type: string }
            region: { type: string }
            centreLatitude: { type: number, minimum: -90, maximum: 90 }
            centreLongitude: { type: number, minimum: -180, maximum: 180 }
            radiusKm: { type: number, minimum: 1, maximum: 500, default: 50 }
        adapterConfig: { type: object, additionalProperties: true }
        dataMode: { $ref: "#/components/schemas/DataMode" }
        sourceId: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
    CriteriaUpdate:
      type: object
      required: [criteria]
      properties:
        criteria: { type: object, additionalProperties: true }
        scheduleEnabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 5 }
        nextRunAt: { type: [string, "null"], format: date-time }
