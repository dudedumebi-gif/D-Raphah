openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: consultations
    description: Public consultation requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /consultations:
    post:
      operationId: createConsultation
      tags: [consultations]
      summary: Submit a consultation request
      description: Stores a client-submitted request for a Raphah.io consultation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationInput"
      responses:
        "201":
          description: Consultation request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationRequest"
        "400":
          description: Invalid consultation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConsultationInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        company:
          type: string
          minLength: 1
          maxLength: 200
        challenge:
          type: string
          minLength: 20
          maxLength: 5000
        timing:
          type: string
          enum:
            - Exploring
            - Ready to make a change
            - Already working on it
            - Not sure yet
      required:
        - fullName
        - email
        - company
        - challenge
        - timing
    ConsultationRequest:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        challenge:
          type: string
        timing:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - email
        - company
        - challenge
        - timing
        - createdAt
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
